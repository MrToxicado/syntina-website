<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Gradients for 3D metallic & electric blue ribbon -->
    <linearGradient id="silver-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    
    <linearGradient id="silver-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="blue-ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0040C0" />
    </linearGradient>

    <linearGradient id="blue-ribbon-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0040C0" />
      <stop offset="100%" stop-color="#001F66" />
    </linearGradient>

    <!-- Glow filter for neon blue highlights -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group: Logo Symbol (Hexagon + Folded S Ribbon) -->
  <g transform="translate(20, 10)">
    <!-- Outer Glowing Hexagon Frame -->
    <polygon points="150,20 270,90 270,210 150,280 30,210 30,90" 
             fill="none" 
             stroke="#FFFFFF" 
             stroke-width="7" 
             stroke-linejoin="round" 
             filter="url(#neon-glow)"/>

    <!-- 3D Ribbon 'S' Top Silver Arm -->
    <path d="M 90,85 L 180,85 L 215,115 L 135,115 Z" fill="url(#silver-grad-1)" />
    <path d="M 90,85 L 135,115 L 105,175 L 60,145 Z" fill="url(#silver-grad-2)" />

    <!-- 3D Ribbon 'S' Blue Folded Bridge -->
    <path d="M 135,115 L 215,115 L 175,185 L 95,185 Z" fill="url(#blue-ribbon-grad)" />
    <path d="M 215,115 L 235,145 L 175,185 Z" fill="url(#blue-ribbon-dark)" />

    <!-- 3D Ribbon 'S' Bottom Silver Arm -->
    <path d="M 175,185 L 235,145 L 210,210 L 120,210 Z" fill="url(#silver-grad-1)" />
    <path d="M 175,185 L 95,185 L 120,210 L 175,210 Z" fill="url(#silver-grad-2)" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="330" y1="50" x2="330" y2="250" stroke="#00F0FF" stroke-width="2" opacity="0.8" filter="url(#neon-glow)"/>

  <!-- Brand Typography: SYNTINA -->
  <text x="365" y="155" 
        font-family="'Outfit', 'Plus Jakarta Sans', 'Arial Black', sans-serif" 
        font-size="88" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#FFFFFF">
    SYNTIN<tspan fill="#00D2FF">A</tspan>
  </text>

  <!-- Tagline Subtitle: Bridging the Scientific Expertise -->
  <!-- Left accent line -->
  <line x1="365" y1="210" x2="425" y2="210" stroke="#00F0FF" stroke-width="3"/>

  <text x="440" y="217" 
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="25" 
        font-weight="600" 
        letter-spacing="2" 
        fill="#FFFFFF">
    Bridging the <tspan fill="#00D2FF" font-weight="700">Scientific</tspan> Expertise
  </text>

  <!-- Right accent line -->
  <line x1="885" y1="210" x2="945" y2="210" stroke="#00F0FF" stroke-width="3"/>
</svg>
